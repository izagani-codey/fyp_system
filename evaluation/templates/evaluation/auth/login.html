{% extends 'evaluation/base.html' %}
{% block title %}Login — FYP Evaluation{% endblock %}
{% block content %}
<div class="form-wrap">
    <div class="card">
        <div class="page-header">
            <h2>Login</h2>
            <p>Enter your credentials to access your dashboard.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" id="id_username" name="username" autocomplete="username" autofocus required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" id="id_password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
        <hr class="divider">
        <p class="text-center" style="font-size:.88rem;">
            No account?
            <a href="{% url 'register_student' %}">Register as Student</a>
            &nbsp;|&nbsp;
            <a href="{% url 'register_judge' %}">Register as Judge</a>
        </p>
    </div>
</div>
{% endblock %}
